name: Update GFG Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gfg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GFG Stats
        run: |
          mkdir -p profile
          curl -fsSL "https://gfg-stats.tashif.codes/codewithsuraj1/stats" -o gfg.json

      - name: Generate GFG SVG
        run: |
          python3 <<'PY'
          import json

          with open("gfg.json", "r") as f:
              response = json.load(f)

          data = response["data"]

          total = data["totalSolved"]
          easy = data["byDifficulty"].get("easy", 0)
          medium = data["byDifficulty"].get("medium", 0)
          hard = data["byDifficulty"].get("hard", 0)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="700"
          height="360"
          viewBox="0 0 700 360">

            <rect
              width="700"
              height="360"
              rx="18"
              fill="#0d1117"
            />

            <text
              x="40"
              y="50"
              fill="#2F8D46"
              font-size="24"
              font-family="Arial"
              font-weight="bold">
              GeeksforGeeks Stats
            </text>

            <text
              x="40"
              y="105"
              fill="#8b949e"
              font-size="16"
              font-family="Arial">
              TOTAL SOLVED
            </text>

            <text
              x="40"
              y="150"
              fill="white"
              font-size="42"
              font-family="Arial"
              font-weight="bold">
              {total}
            </text>

            <text
              x="40"
              y="205"
              fill="#8b949e"
              font-size="17"
              font-family="Arial">
              Easy
            </text>

            <rect
              x="130"
              y="190"
              width="430"
              height="16"
              rx="8"
              fill="#21262d"
            />

            <rect
              x="130"
              y="190"
              width="{min(easy * 4, 430)}"
              height="16"
              rx="8"
              fill="#00bfa5"
            />

            <text
              x="620"
              y="205"
              fill="white"
              font-size="17"
              font-family="Arial">
              {easy}
            </text>

            <text
              x="40"
              y="250"
              fill="#8b949e"
              font-size="17"
              font-family="Arial">
              Medium
            </text>

            <rect
              x="130"
              y="235"
              width="430"
              height="16"
              rx="8"
              fill="#21262d"
            />

            <rect
              x="130"
              y="235"
              width="{min(medium * 4, 430)}"
              height="16"
              rx="8"
              fill="#ffb300"
            />

            <text
              x="620"
              y="250"
              fill="white"
              font-size="17"
              font-family="Arial">
              {medium}
            </text>

            <text
              x="40"
              y="295"
              fill="#8b949e"
              font-size="17"
              font-family="Arial">
              Hard
            </text>

            <rect
              x="130"
              y="280"
              width="430"
              height="16"
              rx="8"
              fill="#21262d"
            />

            <rect
              x="130"
              y="280"
              width="{min(hard * 4, 430)}"
              height="16"
              rx="8"
              fill="#ff375f"
            />

            <text
              x="620"
              y="295"
              fill="white"
              font-size="17"
              font-family="Arial">
              {hard}
            </text>

            <text
              x="40"
              y="335"
              fill="#8b949e"
              font-size="14"
              font-family="Arial">
              @codewithsuraj1
            </text>

          </svg>'''

          with open("profile/gfg-stats.svg", "w") as f:
              f.write(svg)
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/gfg-stats.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GFG stats"
            git push
          fi
