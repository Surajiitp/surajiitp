name: Update GFG Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gfg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Get GFG Stats
        run: |
          python - <<'PY'
          import requests
          import re

          username = "codewithsuraj1"
          url = f"https://www.geeksforgeeks.org/profile/{username}/"

          response = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          print("Status:", response.status_code)

          html = response.text

          patterns = [
              r'"total_problems_solved"\s*:\s*(\d+)',
              r'"problemSolved"\s*:\s*(\d+)',
              r'"problemsSolved"\s*:\s*(\d+)'
          ]

          total = None

          for pattern in patterns:
              match = re.search(pattern, html)
              if match:
                  total = match.group(1)
                  break

          if total is None:
              raise Exception("Could not find GFG solved count")

          print("GFG Problems Solved:", total)

          with open("profile/gfg-count.txt", "w") as f:
              f.write(total)
          PY

      - name: Update README
        run: |
          python - <<'PY'
          import re

          with open("profile/gfg-count.txt") as f:
              count = f.read().strip()

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          readme = re.sub(
              r'(GFG_PROBLEMS_SOLVED:\s*)\d+',
              rf'\g<1>{count}',
              readme
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile/gfg-count.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GFG stats"
            git push
          fi
